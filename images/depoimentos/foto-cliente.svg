<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="#F0EDE7"/>
  <g transform="translate(200,112)" fill="none" stroke="#C4BAB0" stroke-linecap="round" stroke-linejoin="round">
    <!-- camera body -->
    <rect x="-48" y="-32" width="96" height="66" rx="10" stroke-width="2.5"/>
    <!-- lens outer -->
    <circle cx="0" cy="8" r="24" stroke-width="2.5"/>
    <!-- lens inner -->
    <circle cx="0" cy="8" r="12" stroke-width="2"/>
    <!-- viewfinder bump -->
    <path d="M-18,-32 L-18,-44 L6,-44 L6,-32" stroke-width="2.5"/>
    <!-- flash dot -->
    <circle cx="32" cy="-18" r="5" fill="#C4BAB0" stroke="none"/>
  </g>
  <text x="200" y="196" text-anchor="middle" fill="#C4BAB0" font-family="sans-serif" font-size="11" letter-spacing="2">FOTO DO CLIENTE</text>
</svg>
